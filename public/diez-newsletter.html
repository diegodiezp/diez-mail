<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter — Diez Gallery</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--white:#fafafa;--gray:#888;--light:#d8d8d8;--error:#c0392b}
    html,body{height:100%}
    body{font-family:'Replica','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--white);color:var(--black);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
    .container{width:100%;max-width:520px}
    .wordmark{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin-bottom:3rem}
    h1{font-size:1.05rem;font-weight:400;line-height:1.5;margin-bottom:.4rem}
    .sub{font-size:.82rem;color:var(--gray);line-height:1.65;margin-bottom:2.5rem}
    .field{margin-bottom:1.6rem}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.6rem}
    label{display:block;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:.55rem}
    input[type="text"],input[type="email"],input[type="tel"],textarea{width:100%;border:none;border-bottom:1px solid var(--light);background:transparent;font-family:inherit;font-size:.95rem;color:var(--black);padding:.45rem 0;outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0;resize:none}
    textarea{height:3.5rem;line-height:1.5}
    input:focus,textarea:focus{border-bottom-color:var(--black)}
    input::placeholder,textarea::placeholder{color:var(--light)}
    .submit-row{margin-top:2.2rem;display:flex;align-items:center;gap:1.5rem}
    button{background:var(--black);color:var(--white);border:none;font-family:inherit;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.85rem 2.2rem;cursor:pointer;transition:opacity .2s}
    button:hover{opacity:.7}
    button:disabled{opacity:.35;cursor:not-allowed}
    .status{font-size:.78rem;min-height:1.2rem}
    .status.error{color:var(--error)}
    .success-state{display:none}
    .success-state.visible{display:block}
    .form-state.hidden{display:none}
    .success-msg{font-size:1.05rem;font-weight:400;margin-bottom:.5rem}
    .success-sub{font-size:.82rem;color:var(--gray);margin-bottom:2.5rem}
    .back{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color .2s}
    .back:hover{color:var(--black)}
    @media(max-width:520px){body{align-items:flex-start;padding:3rem 1.5rem}.field-row{grid-template-columns:1fr;gap:0}.field-row .field{margin-bottom:1.6rem}}
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Diez Gallery — Amsterdam</div>
    <div class="form-state" id="formState">
      <h1>Stay in the loop.</h1>
      <p class="sub">Exhibition openings, new works, and program updates.</p>
      <div class="field-row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="First name" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="surname">Surname</label>
          <input type="text" id="surname" placeholder="Last name" autocomplete="family-name">
        </div>
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="+31 6 ..." autocomplete="tel">
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="Amsterdam" autocomplete="address-level2">
        </div>
      </div>
      <div class="field">
        <label for="interest">Interest</label>
        <textarea id="interest" placeholder="Artists, themes, or anything you'd like us to know"></textarea>
      </div>
      <div class="submit-row">
        <button id="submitBtn" type="button" onclick="handleSubmit()">Subscribe</button>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="success-state" id="successState">
      <p class="success-msg">You're on the list.</p>
      <p class="success-sub">We'll be in touch from Amsterdam.</p>
      <a class="back" href="https://diez.gallery">← Back to the gallery</a>
    </div>
  </div>
  <script>
    function handleSubmit() {
      var email = document.getElementById('email').value.trim();
      var btn = document.getElementById('submitBtn');
      if (!email || email.indexOf('@') === -1) {
        showStatus('Please enter a valid email address.', 'error');
        return;
      }
      btn.disabled = true;
      showStatus('', '');
      var payload = {
        email: email,
        name: document.getElementById('name').value.trim(),
        surname: document.getElementById('surname').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        city: document.getElementById('city').value.trim(),
        interest: document.getElementById('interest').value.trim()
      };
      fetch('/api/newsletter', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(function(res) {
        if (!res.ok) {
          showStatus('Something went wrong. Please try again.', 'error');
          btn.disabled = false;
          return;
        }
        document.getElementById('formState').classList.add('hidden');
        document.getElementById('successState').classList.add('visible');
      }).catch(function() {
        showStatus('Connection error. Please try again.', 'error');
        btn.disabled = false;
      });
    }
    function showStatus(msg, type) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') handleSubmit();
    });
  </script>
</body>
</html>
